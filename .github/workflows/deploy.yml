name: Deploy

# main への push だけを公開のトリガーにする。
# ローカルから wrangler deploy を叩くと「コミットしていないファイル」まで
# 公開されるため（実際に一度事故を起こしている）、公開の判断基準を
# 手元のファイルシステムではなく git の履歴に一本化する。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 連続 push で古いビルドが後から上書きするのを防ぐ。
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # out/ に前回の生成物が残っていると、削除したはずの記事が
      # 復活して配信される。CI は毎回まっさらだが、意図を明示しておく。
      - name: 静的サイトを生成
        run: |
          rm -rf out .next
          npm run build

      # 取引先の固有名詞だけを止める。自社（Yourtory）は職歴として
      # 意図的に公開しているので対象外。ここを広げすぎると
      # 正当な公開まで落ちて、ガード自体が無効化される方向に働く。
      - name: 取引先の固有名詞が混入していないか検査
        run: |
          if grep -rIlEi 'Fintory' out/ ; then
            echo "::error::取引先の固有名詞が生成物に含まれています"
            exit 1
          fi
          echo "検査通過"

      # CommonMark では句点の直後の「**」が閉じ記号にならないため、
      # 日本語で「〜です。**」と書くとアスタリスクが生のまま表示される。
      # 見た目が壊れるだけで型検査もビルドも通ってしまうので、
      # 生成後のHTMLを見て落とす。
      - name: 記法の崩れが残っていないか検査
        run: |
          if grep -rIl --include='*.html' -e '\*\*' out/ ; then
            echo "::error::Markdownの強調が閉じていない箇所があります（句点を強調の外に出す）"
            exit 1
          fi
          echo "検査通過"

      - name: Cloudflare へデプロイ
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
